<!DOCTYPE html>
<!-- Source for static/images/social_card.jpg (the link-preview image, 1200x630).
     Regenerate from the repo root:
       python3 -m http.server 8765 &
       google-chrome --headless --hide-scrollbars --window-size=1200,630 \
         --screenshot=card.png http://localhost:8765/scripts/social_card.html
       python3 -c "from PIL import Image; Image.open('card.png').convert('RGB').save('static/images/social_card.jpg', quality=88)"
     Keep the image under ~1 MB; some platforms ignore larger preview images. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fdfcfa; }
    body {
      display: flex; align-items: center; gap: 40px;
      padding: 0 52px; box-sizing: border-box;
      font-family: "Inter", sans-serif; color: #1c1917;
      border-top: 10px solid #a05a2c;
    }
    .text { flex: 0 0 430px; }
    .label { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 0.08em; color: #a05a2c; margin-bottom: 18px; }
    h1 { font-family: "Source Serif 4", serif; font-weight: 700; font-size: 41px; line-height: 1.16; margin: 0 0 22px; letter-spacing: -0.01em; }
    .authors { font-size: 18px; color: #57534e; line-height: 1.45; margin-bottom: 6px; }
    .affil { font-size: 16px; color: #a8a29e; }
    .years { margin-top: 26px; font-size: 16px; color: #57534e; }
    .bar { display: inline-block; width: 24px; height: 6px; border-radius: 2px; vertical-align: middle; margin: 0 6px 2px 14px; }
    .bar:first-child { margin-left: 0; }
    img { flex: 1; min-width: 0; width: 100%; mix-blend-mode: multiply; }
  </style>
</head>
<body>
  <div class="text">
    <div class="label">PROJECT PAGE</div>
    <h1>Long&#8209;Term Multi&#8209;Session 3D Reconstruction Under Substantial Appearance Change</h1>
    <div class="authors">Beverley Gorry, Tobias Fischer, Michael Milford, Alejandro Fontan</div>
    <div class="affil">QUT Centre for Robotics</div>
    <div class="years">
      <span class="bar" style="background:#6ab2d4"></span>2016<span class="bar" style="background:#f3c909"></span>2017<span class="bar" style="background:#e377c2"></span>2018
    </div>
  </div>
  <img src="../static/images/teaser.jpg" alt="">
</body>
</html>
